<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Morse Space</title>
</head>

<body>

    <header>
        <h1>Morse Space</h1>
        <p>Spacebar를 이용한 Morse Code 입력기</p>
    </header>


    <main>

        <!-- Spacebar 입력 영역 -->
        <section id="input-section">
            <h2>Input</h2>

            <div id="space-status">
                Spacebar를 눌러주세요
            </div>

            <div id="duration">
                0 ms
            </div>

            <div id="signal-type">
                대기 중
            </div>
        </section>


        <!-- 현재 입력 결과 -->
        <section id="result-section">
            <h2>Result</h2>

            <div id="current-morse">
                -
            </div>

            <div id="decoded-text">
                -
            </div>
        </section>


        <!-- Morse Code 표 -->
        <section id="morse-section">
            <h2>Morse Code Table</h2>

            <div id="morse-category">
                <button type="button" data-category="english">
                    English
                </button>

                <button type="button" data-category="korean">
                    한국어
                </button>

                <button type="button" data-category="number">
                    Number
                </button>
            </div>

            <div id="morse-table">
                <!-- JavaScript가 테이블을 생성 -->
            </div>
        </section>


        <!-- 입력 기록 -->
        <section id="history-section">
            <h2>History</h2>

            <div id="history">
                <!-- JavaScript가 기록을 추가 -->
            </div>

            <button type="button" id="clear-history">
                기록 삭제
            </button>
        </section>

    </main>


    <script src="data/morse.js"></script>
    <script src="script.js"></script>

</body>
</html>
